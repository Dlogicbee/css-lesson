<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Job Application Form</title>
  </head>

  <body>
    <div class="container">
      <h1>Job Application Form</h1>

      <form>
        <label for="app-name">Full Name: </label>
        <input
          type="text"
          id="app-name"
          name="app-name"
          placeholder="E.g., Ade Sola"
          required
        />

        <label for="app-email">Email: </label>
        <input
          type="email"
          id="app-email"
          name="app-email"
          placeholder="E.g., adesola@gmail.com"
          required
        />

        <label for="position">Position: </label>
        <select id="position" name="position" required>
          <option value>Select a positon</option>
          <option value="strategist">Strategist</option>
          <option value="analyst">Analyst</option>
          <option value="project-manager">Project Manager</option>
          <option value="community-manager">Community Manager</option>
          <option value="content-manager">Content Manager</option>
          <option value="graphic-designer" selected>Graphic Designer</option>
          <option value="front-end-developer">Front End Developer</option>
          <option value="back-end-developer">Back End Developer</option>
          <option value="photo-videographer">Photograher/Videographer</option>
          <option value="business-unit-liaison">Business Unit Liaison</option>
        </select>

        <fieldset>
          <legend>Availability</legend>

          <input
            type="radio"
            id="full-time"
            name="time"
            value="full-time"
            class="radio-group-btn"
            checked
          />
          <label for="full-time" class="radio-group"> Full-Time</label>

          <input
            type="radio"
            id="part-time"
            name="time"
            value="full-time"
            class="radio-group-btn"
          />
          <label for="part-time" class="radio-group"> Part-Time</label>
        </fieldset>

        <label for="reason">Why do you want this job?</label>
        <textarea
          id="reason"
          name="reason"
          rows="4"
          cols="60"
          placeholder="Write your motivation"
          required
        ></textarea>

        <button type="submit" class="submit-btn">Submit Application</button>
      </form>
    </div>
  </body>
</html>
