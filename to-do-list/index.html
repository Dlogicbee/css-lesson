<!DOCTYPE HTML>

<HTML LANG="EN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Styled To-Do-List</title>
    </head>

    <body>
        <div class="wrapper">
            <h1>My To-Do List</h1>
            <ul class="todo-list">
                <li>
                    <input type="checkbox" id="lesson" name="todo" />
                    <label for="lesson">Learn advance CSS on FCC</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link"
                            href="https://freecodecamp.org"
                            target="_blank">Lesson's link</a>
                        </li>
                    </ul>
                </li>

                <li>
                    <input type="checkbox" id="exercise" name="todo" />
                    <label for="exercise">Exercise my body</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link"
                                href="#"
                                target="_blank">Workout's link</a>
                        </li>
                    </ul>
                </li>

                <li>
                    <input type="checkbox" id="use" name="todo" />
                    <label for="use">Study Use of English</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link"
                                href="#"
                                target="_blank">Outlines</a>
                        </li>
                    </ul>
                </li>

                <li>
                    <input type="checkbox" id="script" name="todo" />
                    <label for="script">Work on movie scripts</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link"
                                href="#"
                                target="_blank">View movie's note</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </body>
</HTML>
