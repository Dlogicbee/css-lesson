<!doctype html>

<html lang="EN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Playing Card</title>
  </head>

  <body>
    <main id="playing-card">
      <div class="card one">
        <div class="left">
          <p>A</p>
          <p>♠</p>
        </div>
        <div class="middle">
          <p>♠</p>
        </div>
        <div class="right">
          <p>A</p>
          <p>♠</p>
        </div>
      </div>
      <div class="card three">
        <div class="left">
          <p>3</p>
          <p>♣</p>
        </div>
        <div class="middle">
          <p>♣</p>
          <p>♣</p>
          <p class="rotate">♣</p>
        </div>
        <div class="right">
          <p>3</p>
          <p>♣</p>
        </div>
      </div>
      <div class="card five">
        <div class="left">
          <p>5</p>
          <p>♥</p>
        </div>
        <div class="middle">
          <p>
            <span>♥</span>
            <span>♥</span>
          </p>
          <p>♥</p>
          <p>
            <span class="rotate">♥</span>
            <span class="rotate">♥</span>
          </p>
        </div>
        <div class="right">
          <p>5</p>
          <p>♥</p>
        </div>
      </div>
      <div class="card seven">
        <div class="left">
          <p>7</p>
          <p>♦</p>
        </div>
        <div class="middle">
          <p><span>♦</span><span>♦</span></p>
          <span>♦</span>
          <span>♦</span>
          <span>♦</span>
          <p><span>♦</span><span>♦</span></p>
        </div>
        <div class="right">
          <p>7</p>
          <p>♦</p>
        </div>
      </div>
      <div class="card nine">
        <div class="left">
          <p>9</p>
          <p>♠</p>
        </div>
        <div class="middle">
          <p>
            <span>♠</span>
            <span>♠</span>
            <span>♠</span>
          </p>
          <p>
            <span>♠</span>
            <span class="rotate">♠</span>
            <span>♠</span>
          </p>
          <p>
            <span class="rotate">♠</span>
            <span class="rotate">♠</span>
            <span class="rotate">♠</span>
          </p>
        </div>
        <div class="right">
          <p>9</p>
          <p>♠</p>
        </div>
      </div>
    </main>
  </body>
</html>
