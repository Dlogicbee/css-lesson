<!doctype html>

<html lang="EN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Feature Selection</title>
  </head>

  <body>
    <div class="wrapper">
      <h1>Feature Selection</h1>

      <div class="features">
        <input type="checkbox" id="cloud" name="storage" />
        <label for="cloud">
          <strong>Cloud Storage</strong>
          <p>100 Gigabyte secure storage</p>
        </label>
      </div>

      <div class="features">
        <input type="checkbox" id="support" name="dedicated" />
        <label for="support">
          <strong>Dedicated Support</strong>
          <p>24/7 customer help</p>
        </label>
      </div>

      <div class="features">
        <input type="checkbox" id="analytics" name="advanced" />
        <label for="analytics">
          <strong>Advanced Analytics</strong>
          <p>Insights & reports</p>
        </label>
      </div>

      <div class="features">
        <input type="checkbox" id="themes" name="custom-user" />
        <label for="themes">
          <strong>Custom User Themes</strong>
          <p>Personalized dashboard design</p>
        </label>
      </div>

      <div class="features">
        <input type="checkbox" id="collab" name="multi-user" />
        <label for="collab">
          <strong>Multi-User Collab</strong>
          <p>Team access and sharing</p>
        </label>
      </div>

      <div class="features">
        <input type="checkbox" id="api" name="access" />
        <label for="api">
          <strong>API Access</strong>
          <p>Integrate with your custom built tools</p>
        </label>
      </div>
    </div>
  </body>
</html>
