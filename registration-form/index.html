<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Registration Form</title>
  </head>

  <body>
    <h1>Registration Form</h1>

    <p>Please fill out this form with the required information</p>

    <form action="#" method="get">
      <fieldset>
        <label for="first-name">
          Enter Your First Name:
          <input type="text" id="first-name" name="first-name" required />
        </label>

        <label for="last-name">
          Enter Your Last Name:
          <input type="text" id="last-name" name="last-name" required />
        </label>

        <label for="email">
          Enter Your Email:
          <input type="email" id="email" name="email" required />
        </label>

        <label for="new-password">
          Create a New Password:
          <input
            type="password"
            id="new-password"
            name="password"
            pattern="[a-z0-5,{8}]"
            required
          />
        </label>
      </fieldset>

      <fieldset>
        <legend>Account type (required)</legend>

        <label for="personal">
          <input
            type="radio"
            id="personal"
            name="account-type"
            value="personal-account"
            class="inline inline-radio-btn"
            checked
          />
          Personal
        </label>

        <label for="business">
          <input
            type="radio"
            id="business"
            name="account-type"
            value="business-account"
            class="inline inline-radio-btn"
          />
          Business
        </label>
      </fieldset>

      <fieldset>
        <label for="profile-picture">
          Upload a profile picture:
          <input type="file" id="profile-picture" name="picture" required />
        </label>

        <label for="age">
          Input your age(years):
          <input
            type="number"
            id="age"
            name="age"
            min="13"
            max="120"
            required
          />
        </label>

        <label for="referrer">
          How did you hear about us?
          <select id="referrer" name="referrer">
            <option value="">(select an option)</option>
            <option value="friend">Through a friend</option>
            <option value="facebook">On Facebook</option>
            <option value="instagram">On Instagram</option>
            <option value="youtube">On YouTube Channel</option>
            <option value="whatsapp">On WhatsApp Channel</option>
            <option value="twitter">On X (Twitter)</option>
          </select>
        </label>

        <label for="bio">
          Provide a bio:
          <textarea
            id="bio"
            name="bio"
            rows="3"
            cols="30"
            placeholder="I like your app because..."
            required
          ></textarea>
        </label>
      </fieldset>

      <a href="#">Read our terms and conditions</a>
      <label for="terms">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          class="inline"
          required
        />
        I accept the terms and conditions
      </label>

      <input type="submit" value="Submit" class="inline" name="submit-btn" />
    </form>
  </body>
</html>
