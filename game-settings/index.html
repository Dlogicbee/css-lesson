<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Game Settings</title>
  </head>

  <body>
    <div class="settings-card">
      <h1>Game Settings</h1>

      <label for="sound">
        <input type="checkbox" id="sound" />
        Sound Effects
      </label>

      <label for="music">
        <input type="checkbox" id="music" />
        Background Music
      </label>

      <label for="mode">
        <input type="checkbox" id="mode" />
        Hard Mode
      </label>

      <label for="feedback">
        <input type="checkbox" id="feeedback" />
        Haptic Feedback
      </label>
    </div>
  </body>
</html>
